name: Validate bounded SFT collator storage
on:
  push:
    branches: [validation/sft-collate-storage-20261112]
permissions:
  contents: read
jobs:
  native-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 990bc656cb0d08137ecfdc3f85d7f4ec03804aa0
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install matching native CPU dependencies
        run: |
          python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]" torch==2.9.1 torchvision==0.24.1 litdata==0.2.59 litlogger sentencepiece ruff==0.15.9
          python -m pip freeze > installed-dependencies.txt
      - name: Verify exact source and native regression tests
        run: |
          test "$(git rev-parse HEAD)" = "990bc656cb0d08137ecfdc3f85d7f4ec03804aa0"
          python -m ruff check litgpt/data/base.py tests/data/test_collate_bounded_storage.py
          python -m ruff format --check litgpt/data/base.py tests/data/test_collate_bounded_storage.py
          python -m pytest tests/data/test_collate_bounded_storage.py tests/data/test_base.py -q --junitxml=patched.xml
      - name: Measure bounded tensor storage and allocation
        run: |
          python - <<'PY'
          import json
          import torch
          from litgpt.data.base import get_sft_collate_fn
          
          samples = []
          for length in (65536, 32768, 8192):
              ids = torch.arange(length, dtype=torch.long) % 32
              samples.append({"input_ids": ids, "labels": ids.clone(), "token_counts": {"raw": length, "raw_plus_prompt_template": length}})
          with torch.profiler.profile(activities=[torch.profiler.ProfilerActivity.CPU], profile_memory=True) as prof:
              batch = get_sft_collate_fn(max_seq_length=128)(samples)
          result = {
              "torch": torch.__version__,
              "shapes": {key: list(batch[key].shape) for key in ("input_ids", "labels")},
              "logical_bytes": {key: batch[key].numel() * batch[key].element_size() for key in ("input_ids", "labels")},
              "storage_bytes": {key: batch[key].untyped_storage().nbytes() for key in ("input_ids", "labels")},
              "largest_profiled_cpu_allocation_bytes": max(event.cpu_memory_usage for event in prof.events()),
          }
          print(json.dumps(result, indent=2), flush=True)
          assert all(result["storage_bytes"][key] == result["logical_bytes"][key] for key in ("input_ids", "labels"))
          PY
      - name: Run identical regressions on the upstream base
        run: |
          git show 5341568a65e918a85cb284fac038de2157eebf3f:litgpt/data/base.py > litgpt/data/base.py
          python - <<'PY'
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          result = subprocess.run([sys.executable, "-m", "pytest", "tests/data/test_collate_bounded_storage.py", "-q", "--junitxml=baseline.xml"], check=False)
          suites = ET.parse("baseline.xml").getroot()
          totals = {name: sum(int(s.get(name, 0)) for s in suites.iter("testsuite")) for name in ("tests", "failures", "errors", "skipped")}
          print("Exact-base regression totals:", totals, flush=True)
          assert result.returncode == 1, result.returncode
          assert totals == {"tests": 22, "failures": 10, "errors": 0, "skipped": 0}, totals
          PY
          git restore litgpt/data/base.py
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sft-collator-native-results
          path: |
            patched.xml
            baseline.xml
            installed-dependencies.txt
